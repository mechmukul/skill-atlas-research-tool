<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Skill Atlas: from a research question to your own writing</title><desc id="desc">Five steps: create a topic, add PDFs, read and collect useful passages, add your own judgement, then write and export. Codex is an optional helper alongside reading; it does not replace source checking.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf5ff"/><stop offset="1" stop-color="#dbe9ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#245fc7" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
<g fill="#172b46" font-family="Arial,Helvetica,sans-serif"><text x="52" y="52" font-size="14" letter-spacing="3" fill="#4b607b">SKILL ATLAS · YOUR RESEARCH DESK</text><text x="52" y="102" font-size="36" font-weight="600">Less “Where did I read that?” More “Here’s my idea.”</text><text x="52" y="133" font-size="18" fill="#4b607b">Keep the paper, the useful passage and your thinking connected.</text></g>
<g stroke="#245fc7" stroke-width="2" marker-end="url(#arrow)"><path d="M242 277H264"/><path d="M466 277H488"/><path d="M690 277H712"/><path d="M914 277H936"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#172b46">
<g transform="translate(42 180)"><rect width="200" height="204" rx="20" fill="#ffffff" fill-opacity=".8" stroke="#b9ceec"/><circle cx="36" cy="37" r="18" fill="#245fc7"/><text x="36" y="43" text-anchor="middle" fill="white" font-size="18">1</text><text x="22" y="88" font-size="22" font-weight="600">Make a home</text><text x="22" y="121" font-size="16">Choose a topic.</text><text x="22" y="145" font-size="16">Give it a question.</text><text x="22" y="179" font-size="13" fill="#4b607b">Up to five topics</text></g>
<g transform="translate(266 180)"><rect width="200" height="204" rx="20" fill="#ffffff" fill-opacity=".8" stroke="#b9ceec"/><circle cx="36" cy="37" r="18" fill="#245fc7"/><text x="36" y="43" text-anchor="middle" fill="white" font-size="18">2</text><text x="22" y="88" font-size="22" font-weight="600">Bring papers</text><text x="22" y="121" font-size="16">Add your PDFs.</text><text x="22" y="145" font-size="16">Build your library.</text><text x="22" y="179" font-size="13" fill="#4b607b">Originals stay untouched</text></g>
<g transform="translate(490 180)"><rect width="200" height="204" rx="20" fill="#ffffff" fill-opacity=".8" stroke="#b9ceec"/><circle cx="36" cy="37" r="18" fill="#245fc7"/><text x="36" y="43" text-anchor="middle" fill="white" font-size="18">3</text><text x="22" y="88" font-size="22" font-weight="600">Read &amp; collect</text><text x="22" y="121" font-size="16">Keep useful passages.</text><text x="22" y="145" font-size="16">Bookmark your place.</text><text x="22" y="179" font-size="13" fill="#4b607b">Keep the source in sight</text></g>
<g transform="translate(714 180)"><rect width="200" height="204" rx="20" fill="#ffffff" fill-opacity=".8" stroke="#b9ceec"/><circle cx="36" cy="37" r="18" fill="#245fc7"/><text x="36" y="43" text-anchor="middle" fill="white" font-size="18">4</text><text x="22" y="88" font-size="22" font-weight="600">Think &amp; check</text><text x="22" y="121" font-size="16">Add your own notes.</text><text x="22" y="145" font-size="16">Check the original.</text><text x="22" y="179" font-size="13" fill="#4b607b">Your judgement matters</text></g>
<g transform="translate(938 180)"><rect width="220" height="204" rx="20" fill="#ffffff" fill-opacity=".8" stroke="#b9ceec"/><circle cx="36" cy="37" r="18" fill="#245fc7"/><text x="36" y="43" text-anchor="middle" fill="white" font-size="18">5</text><text x="22" y="88" font-size="22" font-weight="600">Write &amp; take away</text><text x="22" y="121" font-size="16">Develop your argument.</text><text x="22" y="145" font-size="16">Export a draft or backup.</text><text x="22" y="179" font-size="13" fill="#4b607b">Return and keep building</text></g>
</g>
<path d="M590 384V420" stroke="#245fc7" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="365" y="420" width="470" height="87" rx="18" fill="#ffffff" fill-opacity=".65" stroke="#b9ceec"/>
<g fill="#172b46" font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="600" y="451" font-size="20" font-weight="600">Optional: invite a Codex reading helper</text><text x="600" y="479" font-size="16">AI drafts are suggestions. You check the paper.</text><text x="600" y="557" font-size="20">Collected ≠ fully read ≠ verified</text><text x="600" y="587" font-size="15" fill="#4b607b">Different achievements. Your research stays connected.</text></g>
</svg>
